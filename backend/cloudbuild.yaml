steps:
  # 1. Pull the previous builder and final images from GCR to use as cache sources
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull gcr.io/${PROJECT_ID}/linkvault-backend-builder:latest || true
        docker pull gcr.io/${PROJECT_ID}/linkvault-backend:latest || true

  # 2. Build the builder stage, utilizing the builder cache image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--target'
      - 'builder'
      - '--cache-from'
      - 'gcr.io/${PROJECT_ID}/linkvault-backend-builder:latest'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/linkvault-backend-builder:latest'
      - '.'

  # 3. Build the final image using both the builder and final cache images
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'gcr.io/${PROJECT_ID}/linkvault-backend-builder:latest'
      - '--cache-from'
      - 'gcr.io/${PROJECT_ID}/linkvault-backend:latest'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/linkvault-backend:latest'
      - '.'

# Push both images back to GCR so they are updated for the next build's cache
images:
  - 'gcr.io/${PROJECT_ID}/linkvault-backend-builder:latest'
  - 'gcr.io/${PROJECT_ID}/linkvault-backend:latest'
