steps:
  # 1. Pull the previous builder and final images from Artifact Registry to use as cache sources
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend-builder:latest || true
        docker pull us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend:latest || true

  # 2. Build the builder stage, utilizing the builder cache image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--target'
      - 'builder'
      - '--cache-from'
      - 'us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend-builder:latest'
      - '-t'
      - 'us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend-builder:latest'
      - '.'

  # 3. Build the final image using both the builder and final cache images
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend-builder:latest'
      - '--cache-from'
      - 'us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend:latest'
      - '-t'
      - 'us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend:latest'
      - '.'

# Push both images back to Artifact Registry
images:
  - 'us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend-builder:latest'
  - 'us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend:latest'
