steps:
  # 1. Setup Buildx builder using the docker-container driver to support registry caching
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --name mybuilder --driver docker-container --use
        docker buildx inspect --bootstrap

  # 2. Build and push the backend container using buildx remote registry caching (mode=max for all stages)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx build \
          --builder mybuilder \
          --push \
          -t us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend:latest \
          --cache-from type=registry,ref=us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend:buildcache \
          --cache-to type=registry,ref=us-west1-docker.pkg.dev/${PROJECT_ID}/linkvault/backend:buildcache,mode=max \
          .
